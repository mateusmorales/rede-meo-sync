name: Motor 2 - Conferencia diaria

# Sem inputs (cron-job.org) = comportamento diario: ultimos 45 dias.
# Com data_ini/data_fim = rele o periodo pedido (reprocessamento sob demanda).
on:
  workflow_dispatch:
    inputs:
      data_ini:
        description: 'vendas: data inicial YYYY-MM-DD (vazio = hoje - 45 dias)'
        required: false
        type: string
      data_fim:
        description: 'vendas: data final YYYY-MM-DD (vazio = hoje)'
        required: false
        type: string

jobs:
  conferencia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar Motor 2
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINX_CHAVE: ${{ secrets.LINX_CHAVE }}
          IN_DATA_INI: ${{ inputs.data_ini }}
          IN_DATA_FIM: ${{ inputs.data_fim }}
        run: python motor2_conferencia.py
