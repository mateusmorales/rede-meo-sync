name: Motor F360

# Disparo EXTERNO pelo cron-job.org (padrão do projeto — o schedule nativo do Actions atrasa/pula):
#   diário   06:00 BRT  -> inputs.camada = incremental
#   domingo  06:30 BRT  -> inputs.camada = recarga_curta
#   dia 1º   07:00 BRT  -> inputs.camada = recarga_longa
on:
  workflow_dispatch:
    inputs:
      camada:
        description: 'Camada a executar'
        type: choice
        default: incremental
        options: [incremental, recarga_curta, recarga_longa]

concurrency:
  group: motor-f360
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet psycopg2-binary
      - name: Executar motor
        env:
          F360_KEY: ${{ secrets.F360_KEY }}
          FINANCEIRO_DATABASE_URL: ${{ secrets.FINANCEIRO_DATABASE_URL }}
          CAMADA: ${{ github.event.inputs.camada || 'incremental' }}
        run: python motores/f360/motor_f360.py "$CAMADA"
